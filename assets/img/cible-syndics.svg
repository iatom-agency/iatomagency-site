      <rect x="204" y="154" width="26" height="30"/><rect x="250" y="154" width="26" height="30"/><rect x="286" y="154" width="26" height="30"/>
      <rect x="168" y="196" width="26" height="30"/><rect x="204" y="196" width="26" height="30"/>
    </g>
    <g fill="#E8A33D">
