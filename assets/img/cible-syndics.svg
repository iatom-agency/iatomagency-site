  <rect x="330" y="96" width="70" height="166" fill="#EAE1D3" stroke="#0F4C55" stroke-width="2"/>
  <g fill="#DCEBEC" stroke="#0F4C55" stroke-width="1.4">
    <rect x="100" y="138" width="16" height="20"/><rect x="124" y="138" width="16" height="20"/>
    <rect x="100" y="176" width="16" height="20"/><rect x="124" y="176" width="16" height="20"/>
    <rect x="344" y="114" width="16" height="20"/><rect x="370" y="114" width="16" height="20"/>
    <rect x="344" y="152" width="16" height="20"/><rect x="370" y="152" width="16" height="20"/>
    <rect x="344" y="190" width="16" height="20"/><rect x="370" y="190" width="16" height="20"/>
  </g>
  <!-- arbre -->
